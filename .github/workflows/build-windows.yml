# Nickland Edusoft — tests + Windows .exe builder
#
# The `test` job runs on every push and pull request, on any branch — it needs
# no native build and no dependency install, so it is fast and always runs.
# The Windows installer is only produced for main/master and v* tags, and only
# after the tests pass, so a broken build can never ship as an installer.
name: Build Windows Installer

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:  # adds a "Run workflow" button in the Actions tab

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # These suites deliberately use node:sqlite and Node built-ins so they
      # run without installing or compiling anything.
      - name: Desktop regression tests
        run: node test/regressions.js

      - name: Cloud sync end-to-end (Node cloud + real desktop client)
        run: node cloud/test/e2e.js

      - name: Parent portal (Node cloud)
        run: node cloud/test/portal.js

      - name: Install Python cloud dependencies
        run: pip install -r cloud-python/requirements.txt httpx

      - name: Python cloud + cross-language scrypt
        run: python3 tests/test_portal.py
        working-directory: cloud-python

      - name: Cross-language end-to-end (Node client → Python cloud)
        run: bash tests/cross_lang.sh
        working-directory: cloud-python

  build-windows:
    name: Windows installer
    needs: test
    # Only build the installer for the release branches and version tags.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python (needed by native node modules)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Rebuild native modules for Electron
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Build renderer (Vite)
        run: npm run build:renderer

      - name: Package Windows installer
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        run: dir dist-app
        shell: cmd

      - name: Upload installer as workflow artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nickland-edusoft-windows
          path: |
            dist-app/*.exe
            dist-app/*.blockmap
            dist-app/latest.yml
          retention-days: 1
          if-no-files-found: error

      - name: Create GitHub Release (only on tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-app/*.exe
            dist-app/*.blockmap
            dist-app/latest.yml
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
