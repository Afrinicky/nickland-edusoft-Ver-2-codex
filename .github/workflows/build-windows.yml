# Nickland Edusoft — tests, the web app, and the Windows .exe builder
#
# The `test` job runs on every push and pull request, on any branch — it needs
# no native build and no dependency install, so it is fast and always runs.
# `web` builds the browser version of the mobile app on every branch too, so a
# screen that will not bundle is caught on the pull request rather than at
# deploy time. The Windows installer is only produced for main/master and v*
# tags, and only after both pass, so a broken build can never ship as an
# installer — and it packages the web build, which is how a desktop serves the
# app to phones on the school Wi-Fi with no internet at all.
name: Build Windows Installer

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:  # adds a "Run workflow" button in the Actions tab

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node 22, not the 20 the installer job uses: the suites build their
      # fixtures on the built-in `node:sqlite`, which first shipped in 22.5.
      # That keeps them free of a native better-sqlite3 build on the runner.
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # These suites deliberately use node:sqlite and Node built-ins so they
      # run without installing or compiling anything.
      - name: Desktop regression tests
        run: node test/regressions.js

      - name: Web app serving (desktop host)
        run: node test/webapp.js

      - name: Cloud sync end-to-end (Node cloud + real desktop client)
        run: node cloud/test/e2e.js

      - name: Parent portal (Node cloud)
        run: node cloud/test/portal.js

      - name: Install Python cloud dependencies
        run: pip install -r cloud-python/requirements.txt httpx

      - name: Python cloud + cross-language scrypt
        run: python3 tests/test_portal.py
        working-directory: cloud-python

      - name: Cross-language end-to-end (Node client → Python cloud)
        run: bash tests/cross_lang.sh
        working-directory: cloud-python

  web:
    name: Web app
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci --no-audit --no-fund
        working-directory: mobile

      # EXPO_PUBLIC_PORTAL_URL is baked into the bundle. Set it as a repository
      # variable (Settings → Secrets and variables → Actions → Variables) to the
      # public API address, so a build hosted apart from its API — the Vercel
      # deploy talking to Render — knows where to look. Left unset, the app asks
      # its own origin, which is what the desktop-served copy needs.
      - name: Build the web app
        run: node scripts/build-web.mjs --only-build
        env:
          EXPO_PUBLIC_PORTAL_URL: ${{ vars.EXPO_PUBLIC_PORTAL_URL }}

      - name: Upload the web app
        uses: actions/upload-artifact@v4
        with:
          name: nickland-edusoft-web
          path: mobile/dist-web
          retention-days: 7
          if-no-files-found: error

      # A single file is what a school actually downloads and unzips onto a
      # server; the artifact above is what the Windows job consumes.
      - name: Zip the web app for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cd mobile/dist-web && zip -qr ../../nickland-edusoft-web.zip .

      - name: Attach the web app to the release (only on tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nickland-edusoft-web.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Windows installer
    needs: [test, web]
    # Only build the installer for the release branches and version tags.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node 20 matches what Electron 32 is built against; leave it alone.
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python (needed by native node modules)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Packaged into the installer, so the desktop can serve the app to phones
      # and laptops on the school Wi-Fi. electron-builder ships everything under
      # resources/, and the host looks for resources/webapp.
      - name: Fetch the web app build
        uses: actions/download-artifact@v4
        with:
          name: nickland-edusoft-web
          path: resources/webapp

      - name: Rebuild native modules for Electron
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Build renderer (Vite)
        run: npm run build:renderer

      - name: Package Windows installer
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        run: dir dist-app
        shell: cmd

      - name: Upload installer as workflow artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nickland-edusoft-windows
          path: |
            dist-app/*.exe
            dist-app/*.blockmap
            dist-app/latest.yml
          retention-days: 1
          if-no-files-found: error

      - name: Create GitHub Release (only on tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-app/*.exe
            dist-app/*.blockmap
            dist-app/latest.yml
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
