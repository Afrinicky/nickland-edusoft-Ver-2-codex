<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nickland Edusoft</title>
  <!--
    No web fonts, and no network in the policy that would allow any.

    This used to pull six families from Google Fonts. A school's internet is
    not dependable and is frequently simply off at seven in the morning, so
    every one of those requests failed and the whole app fell back down its
    stack to Cambria — a SERIF — which is most of why it looked soft and
    unprofessional. An app whose first rule is "offline is the normal case"
    cannot have its typography depend on a CDN.

    The type is a system stack now (see --font-family in styles/index.css and
    FONT_STACKS in store/index.js). Segoe UI is on every Windows machine this
    ships to, weight and tracking carry the hierarchy, and nothing has to load.
  -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' file: data:; connect-src 'self';" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
