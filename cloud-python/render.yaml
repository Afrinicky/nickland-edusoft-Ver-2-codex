# Render.com blueprint — the Nickland Edusoft cloud, in one service.
# Docs: https://render.com/docs/blueprint-spec
#
# Create it with "New → Blueprint" pointed at this repository, then set
# DATABASE_URL and PORTAL_BASE_DOMAIN in the dashboard and copy the generated
# PLATFORM_ADMIN_KEY out of it. Nothing else is needed: the service creates its
# own tables on first boot and carries the parents' app inside the image.
services:
  - type: web
    name: nickland-edusoft-cloud
    runtime: docker

    # The build context is the REPOSITORY ROOT and not cloud-python/, because
    # the image also builds the parents' and teachers' app out of mobile/ so
    # that one address is the whole product. (This is why there is no rootDir:
    # it would put mobile/ outside the context and the COPY would fail.)
    dockerfilePath: ./cloud-python/Dockerfile
    dockerContext: .

    healthCheckPath: /health
    plan: starter          # the free plan sleeps, and a sleeping portal is a portal parents stop trusting
    autoDeploy: true

    # SAME REGION AS THE DATABASE. Choose the Neon region first, then match it
    # here: an online school's screen is many small queries, and each one is a
    # round trip. Frankfurt is the shortest hop for Ghana.
    region: frankfurt

    envVars:
      # ── Required ──
      - key: DATABASE_URL
        sync: false                  # the Neon connection string, POOLED, with ?sslmode=require

      # Signs parent and teacher sessions. Generated once, on creation.
      # Do NOT regenerate it on a later deploy: every signed-in parent and
      # teacher is signed out the moment it changes.
      - key: PORTAL_SECRET
        generateValue: true

      # ── Nickland's own key ──
      # The only credential that can bring a school into existence, which is
      # why it is not a school key and is not in this file. Render generates
      # it; read it once from the dashboard and keep it where the school keys
      # are not. Under 24 characters the platform routes stay off — the boot
      # log says so in those words.
      - key: PLATFORM_ADMIN_KEY
        generateValue: true

      # ── The schools' addresses ──
      # One domain or several, comma-separated; the first is canonical. Point a
      # wildcard DNS record (*.edusoft.gh) at this service and every school
      # enrolled from now on is reachable at <school-id>.edusoft.gh with
      # nothing further to configure. Leave it unset and the service still
      # works — schools simply have no address of their own.
      - key: PORTAL_BASE_DOMAIN
        sync: false

      # ── The website's and the console's own addresses ──
      # Each is named on its own and borrows nothing from PORTAL_BASE_DOMAIN,
      # whose bare name, www and subdomains all stay with the school
      # application. Matching is exact — the domain and its `www.` — so the
      # console can sit on a subdomain of the website's domain and still be the
      # console, because it was named.
      #
      # Leave either unset and that interface simply has no domain: it is still
      # reached at /welcome and /console on every address, which is also how
      # local development works.
      - key: PUBLIC_SITE_DOMAIN
        sync: false
      - key: CONSOLE_DOMAIN
        sync: false

      # ── Taking the platform's own money ──
      # NICKLAND's gateway key, for charging SCHOOLS their subscription. It is
      # NOT a school's gateway key — a school's own key, for taking fees from
      # parents, is pushed up by that school's desktop and never appears here.
      #
      # Left unset, the platform still works: schools register, start a trial
      # and use everything, and no card is taken. The boot log says which of
      # the two a running service is doing, so it is not a silent state.
      - key: PLATFORM_PAYSTACK_SECRET
        sync: false
      - key: PLATFORM_PAYSTACK_PUBLIC
        sync: false                  # the publishable key; the browser needs it

      # ── The billing run ──
      # A scheduler POSTs to /api/v1/admin/cron/billing-run with this in
      # `x-cron-key`. Its own secret, so a cron service never has to hold the
      # console's key. Under 16 characters the route is not there at all.
      #
      # Render: New → Cron Job, daily, running
      #   curl -fsS -X POST -H "x-cron-key: $BILLING_CRON_SECRET" \
      #        https://<this service>/api/v1/admin/cron/billing-run
      #
      # A SECOND cron wants the same key, more often — every ten minutes is
      # sensible — to push the text messages a school has queued:
      #   curl -fsS -X POST -H "x-cron-key: $BILLING_CRON_SECRET" \
      #        https://<this service>/api/v1/admin/cron/notifications
      # It does nothing at all for a school that has not set up Arkesel, so it
      # is safe to schedule before anybody has.
      - key: BILLING_CRON_SECRET
        generateValue: true

      # ── Signing the offline licences ──
      # Ed25519, base64. The PRIVATE half signs leases here and never leaves
      # this service; the desktop carries only the public half, which can check
      # a lease and never make one. Generate with:
      #   python3 -c "import sys;sys.path.insert(0,'cloud-python');\
      #     from app.billing.licence import generate_key;print(generate_key())"
      #
      # Left unset the platform generates one on first use and keeps it in
      # platform_settings — which works, and means anyone with the database
      # could sign licences. The boot report says which of the two is in use.
      # CHANGING IT INVALIDATES EVERY LICENCE ALREADY ISSUED: each desktop
      # drops to read-only until it collects a fresh one, which it does on its
      # next check-in. Do not rotate it casually.
      - key: LICENCE_SIGNING_KEY
        sync: false

      - key: WEB_CONCURRENCY
        value: "2"
